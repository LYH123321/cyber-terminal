<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>陪看</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#21262d;--text:#e6edf3;--muted:#8b949e;--primary:#58a6ff;--user:#1f6feb;--kafka:#c77dff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,'Noto Sans SC',sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0}
header h1{font-size:16px;flex:1}
.hbtn{background:none;border:none;color:var(--primary);font-size:13px;padding:8px}
#lib{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px}
.vcard .ic{width:40px;height:40px;border-radius:10px;background:#1f2937;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.vcard .meta{flex:1;min-width:0}
.vcard .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcard .sub{font-size:11px;color:var(--muted);margin-top:4px}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:60px 20px;line-height:2}
#player{flex:1;display:none;flex-direction:column;overflow:hidden}
#vwrap{position:relative;background:#000;flex-shrink:0;max-height:56%}
video{width:100%;max-height:56vh;display:block}
#subbox{position:absolute;left:0;right:0;bottom:8px;text-align:center;pointer-events:none;padding:0 12px}
.subline{font-size:15px;font-weight:600;text-shadow:0 1px 3px #000,0 0 6px #000;color:#fff;line-height:1.4}
.subline.tr{font-size:13px;font-weight:400;color:#ffd166;margin-top:3px}
#kafka{position:absolute;right:8px;top:8px;max-width:72%;background:rgba(199,125,255,.18);border:1px solid rgba(199,125,255,.5);backdrop-filter:blur(6px);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.5;color:#f3e8ff;pointer-events:none;opacity:0;transition:opacity .3s}
#kafka.show{opacity:1}
#kafka .who{color:var(--kafka);font-weight:700;font-size:11px;display:block;margin-bottom:2px}
#panel{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
#panel h3{font-size:12px;color:var(--muted);font-weight:600}
.cue{font-size:13px;line-height:1.5;padding:6px 8px;border-radius:8px}
.cue.cur{background:#1c2530}
.cue .t{color:var(--muted);font-size:10px;font-family:monospace}
.cue .o{color:var(--text)}
.cue .z{color:#ffd166;margin-top:2px}
.cue .z.pending{color:var(--muted);font-style:italic}
.bar{display:flex;gap:8px;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);background:var(--card);border-top:1px solid var(--line);flex-shrink:0}
.bbtn{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:13px}
.bbtn.pri{background:var(--primary);border:none;color:#fff;font-weight:600}
.bbtn:disabled{opacity:.4}
#novel{flex:1;overflow-y:auto;display:none;padding:14px;flex-direction:column;gap:10px}
#novel .line{font-size:15px;line-height:1.8}
#novel .line .tt{color:var(--muted);font-size:11px;font-family:monospace;margin-right:8px}
#novel .line .zz{color:#ffd166}
#novel .kk{color:var(--kafka);font-size:13px;background:rgba(199,125,255,.1);border-left:3px solid var(--kafka);padding:6px 10px;border-radius:0 8px 8px 0}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;font-size:12px;padding:8px 14px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:80%}
#toast.show{opacity:1}
#cfg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:10}
#cfg.open{display:block}
#cfg .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:16px 16px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 20px)}
#cfg h2{font-size:15px;margin-bottom:12px}
#cfg .f{margin-bottom:12px}
#cfg label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
#cfg input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px;font-size:13px;font-family:monospace;outline:none;box-sizing:border-box}
#cfg .hint{font-size:11px;color:var(--muted);margin-top:4px}
#cfg .row{display:flex;gap:10px;margin-top:8px}
#cfg .row button{flex:1;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px}
#cfg .row .pri{background:var(--primary);color:#fff;border:none;font-weight:600}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="hbtn" id="btnBack">‹ 返回</button>
    <h1>📺 卡芙卡陪看</h1>
    <button class="hbtn" id="btnKfk">💬 吐槽</button>
    <button class="hbtn" id="btnSet">⚙</button>
  </header>

  <div id="lib"></div>

  <div id="player">
    <div id="vwrap">
      <video id="vid" controls playsinline></video>
      <div id="subbox"><div class="subline" id="subO"></div><div class="subline tr" id="subZ"></div></div>
      <div id="kafka"><span class="who">卡芙卡</span><span id="kfkText"></span></div>
    </div>
    <div id="panel">
      <h3 id="pTitle">字幕</h3>
      <div id="cues"></div>
    </div>
    <div id="novel"></div>
    <div class="bar">
      <button class="bbtn" id="btnMode">📖 小说模式</button>
      <button class="bbtn pri" id="btnTr">🌐 翻译字幕</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<div id="cfg"><div class="sheet">
  <h2>陪看模型（独立于日常聊天）</h2>
  <div class="f"><label>API Base URL</label><input id="vUrl" placeholder="留空 = 沿用日常聊天的配置">
    <div class="hint">例：https://api.ant-ling.com/v1 或本地 http://127.0.0.1:8001/v1</div></div>
  <div class="f"><label>API Key</label><input id="vKey" type="password" placeholder="留空 = 沿用日常聊天"></div>
  <div class="f"><label>模型</label><input id="vModel" placeholder="留空 = 沿用日常聊天"></div>
  <div class="row"><button id="vCancel">取消</button><button class="pri" id="vSave">保存</button></div>
</div></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const NATIVE=!!window.Android;
const P={get:k=>NATIVE?Android.getPref(k):(localStorage.getItem(k)||'')};
const CFG={url:P.get('url')||'',key:P.get('key')||'',model:P.get('model')||'Ling-3.1-flash'};
let CUR=null;   // {name,sub}
let CUES=[];    // {t0,t1,o,z}
let curIdx=-1, novelMode=false, trBusy=false, kfkBusy=false, lastKfk=-99;
// 陪看页独立模型配置：留空回落到日常聊天配置（聊天可用 glm，陪看用宽松/本地模型）
function loadCfg(){
  const u=P.get('vurl'),k=P.get('vkey'),m=P.get('vmodel');
  CFG.url=u||P.get('url')||'';
  CFG.key=k||P.get('key')||'';
  CFG.model=m||P.get('model')||'Ling-3.1-flash';
}
loadCfg();
$('btnSet').onclick=()=>{$('vUrl').value=P.get('vurl');$('vKey').value=P.get('vkey');$('vModel').value=P.get('vmodel');$('cfg').classList.add('open')};
$('vCancel').onclick=()=>$('cfg').classList.remove('open');
$('vSave').onclick=()=>{
  const put=(k,v)=>{NATIVE?Android.setPref&&Android.setPref(k,v):localStorage.setItem(k,v)};
  put('vurl',$('vUrl').value.trim());put('vkey',$('vKey').value.trim());put('vmodel',$('vModel').value.trim());
  loadCfg();$('cfg').classList.remove('open');toast('陪看模型已保存');
};

function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
function fmt(s){s=Math.max(0,s|0);return String((s/60)|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function cacheKey(){return 'vtr:'+CUR.name+':'+CUR.sub}

// ---------- 字幕解析 ----------
function t2s(t){
  const m=t.trim().match(/(\d+):(\d+):(\d+)[,.](\d+)/); if(!m)return 0;
  return (+m[1])*3600+(+m[2])*60+(+m[3])+(+m[4])/1000;
}
function stripTags(s){return s.replace(/<[^>]+>/g,'').replace(/\{\\[^}]*\}/g,'').replace(/\r/g,'').trim()}
function parseSRT(txt){
  const out=[];const blocks=txt.replace(/\r/g,'').split(/\n\n+/);
  for(const b of blocks){
    const lines=b.split('\n').filter(l=>l.trim()!=='');
    if(lines.length<2)continue;
    let ti=lines.findIndex(l=>l.includes('-->'));
    if(ti<0)continue;
    const [a,z]=lines[ti].split('-->');
    const o=lines.slice(ti+1).join('\n').trim();
    if(o)out.push({t0:t2s(a),t1:t2s(z),o,z:null});
  }
  return out;
}
function parseASS(txt){
  const out=[];let fmt=null;
  for(const line of txt.replace(/\r/g,'').split('\n')){
    if(line.startsWith('Format:')&&line.includes('Text')){fmt=line.slice(7).split(',').map(s=>s.trim());continue}
    if(!line.startsWith('Dialogue:'))continue;
    const parts=line.slice(9).split(',');
    if(parts.length<3)continue;
    const t0=t2s(parts[1]),t1=t2s(parts[2]);
    const text=parts.slice(fmt?fmt.indexOf('Text'):9).join(',').replace(/\\N/g,'\n');
    const o=stripTags(text);
    if(o)out.push({t0,t1,o,z:null});
  }
  return out;
}

// ---------- 视频库 ----------
async function loadLib(){
  const r=await fetch('/list');const list=await r.json();
  const lib=$('lib');lib.innerHTML='';
  if(!list.length){lib.innerHTML='<div class="empty">视频目录是空的~<br>把视频和同名 .srt / .ass 字幕放到<br><b>/sdcard/CyberVideos/</b><br>例如：OP01.mp4 + OP01.srt</div>';return}
  for(const v of list){
    const d=document.createElement('div');d.className='vcard';
    d.innerHTML=`<div class="ic">${v.sub?'🎬':'📼'}</div><div class="meta"><div class="nm">${v.name}</div><div class="sub">${(v.size/1048576).toFixed(0)} MB · ${v.sub?('字幕 '+v.sub):'无字幕（无翻译/吐槽）'}</div></div>`;
    d.onclick=()=>play(v);
    lib.appendChild(d);
  }
}

// ---------- 播放 ----------
async function play(v){
  CUR=v;CUES=[];curIdx=-1;lastKfk=-99;
  $('lib').style.display='none';$('player').style.display='flex';
  $('pTitle').textContent=v.name;
  $('vid').src='/f?name='+encodeURIComponent(v.name);
  if(v.sub){
    const r=await fetch('/sub?name='+encodeURIComponent(v.sub));
    const txt=await r.text();
    CUES=v.sub.toLowerCase().endsWith('.ass')?parseASS(txt):parseSRT(txt);
    // 载入翻译缓存
    try{const c=JSON.parse(localStorage.getItem(cacheKey())||'[]');
      for(let i=0;i<Math.min(c.length,CUES.length);i++)if(c[i])CUES[i].z=c[i];
    }catch{}
    renderCues();
    toast('字幕 '+CUES.length+' 条'+(CUES.some(c=>c.z)?'（翻译已有缓存）':''));
  }else{
    $('cues').innerHTML='<div class="empty" style="padding:30px">没有字幕文件，纯播放模式~</div>';
  }
  $('vid').play().catch(()=>{});
}
function renderCues(){
  const box=$('cues');box.innerHTML='';
  for(let i=0;i<CUES.length;i++){
    const c=CUES[i];
    const d=document.createElement('div');d.className='cue';d.id='cue'+i;
    d.innerHTML=`<span class="t">${fmt(c.t0)}</span> <span class="o">${esc(c.o)}</span>`+
      (c.z?`<div class="z">${esc(c.z)}</div>`:`<div class="z pending">（待翻译）</div>`);
    box.appendChild(d);
  }
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

$('vid').addEventListener('timeupdate',()=>{
  if(!CUES.length||novelMode)return;
  const t=$('vid').currentTime;
  let i=curIdx;
  if(i>=0&&i<CUES.length&&t>=CUES[i].t0&&t<CUES[i].t1)return; // 还在当前条
  if(i>=0&&i<CUES.length&&t<CUES[i].t1&&t>=CUES[i].t0)return;
  // 找新条（支持快进/后退）
  let ni=-1;
  for(let j=0;j<CUES.length;j++){if(t>=CUES[j].t0&&t<CUES[j].t1){ni=j;break}}
  if(ni===curIdx)return;
  if(ni<0){$('subO').textContent='';$('subZ').textContent='';if(curIdx>=0){const e=$('cue'+curIdx);if(e)e.classList.remove('cur')}curIdx=-1;return}
  if(curIdx>=0){const e=$('cue'+curIdx);if(e)e.classList.remove('cur')}
  curIdx=ni;
  const c=CUES[ni];const e=$('cue'+ni);
  if(e){e.classList.add('cur');e.scrollIntoView({block:'center',behavior:'smooth'})}
  $('subO').textContent=c.o.replace(/\n/g,' ');
  $('subZ').textContent=c.z||'';
  // 卡芙卡吐槽：每 20 条一次
  if(ni-lastKfk>=20&&!kfkBusy){lastKfk=ni;kafkaComment(ni)}
});

// ---------- LLM ----------
async function chat(sys,user,maxTok){
  const body=JSON.stringify({model:CFG.model,messages:[{role:'system',content:sys},{role:'user',content:user}],temperature:0.7,max_tokens:maxTok||2000});
  let text;
  if(NATIVE){ text=Android.httpPost(CFG.url.replace(/\/+$/,'')+'/chat/completions',body,CFG.key); } // 原生代发：本地模型(8001)与云端通用，绕开 CORS
  else{
    const r=await fetch(CFG.url.replace(/\/+$/,'')+'/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+CFG.key},body});
    text=await r.text();
  }
  let j;try{j=JSON.parse(text)}catch{throw new Error('bad json: '+text.slice(0,120))}
  if(j.error)throw new Error(typeof j.error==='string'?j.error:JSON.stringify(j.error).slice(0,120));
  return (j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||'').trim();
}

// ---------- 批量翻译 ----------
async function translateAll(){
  if(!CUES.length){toast('没有字幕');return}
  if(!CFG.key){toast('先去日常聊天页设置 API');return}
  if(trBusy){toast('翻译中…');return}
  trBusy=true;$('btnTr').disabled=true;$('btnTr').textContent='🔄 翻译中…';
  const todo=CUES.map((c,i)=>c.z?null:i).filter(i=>i!=null);
  toast('待翻译 '+todo.length+' 条');
  const BATCH=25;
  const cache=CUES.map(c=>c.z||null);
  try{
    for(let s=0;s<todo.length;s+=BATCH){
      const idxs=todo.slice(s,s+BATCH);
      const lines=idxs.map(i=>(i+1)+'|'+CUES[i].o.replace(/\n/g,' ⏎ '));
      const sys='你是字幕翻译。把用户给的编号台词翻译成简体中文，保留原意与语气，动漫腔要自然。逐行输出：编号|译文。不要输出其他任何内容。';
      const out=await chat(sys,lines.join('\n'),3000);
      for(const line of out.split('\n')){
        const m=line.match(/^\s*(\d+)\s*[|｜:：]\s*(.+)$/);if(!m)continue;
        const i=+m[1]-1;if(i>=0&&i<CUES.length&&idxs.includes(i)){CUES[i].z=m[2].trim();cache[i]=CUES[i].z}
      }
      localStorage.setItem(cacheKey(),JSON.stringify(cache));
      $('btnTr').textContent='🌐 '+Math.min(s+BATCH,todo.length)+'/'+todo.length;
      // 刷新当前屏
      for(const i of idxs){const e=$('cue'+i);if(e&&CUES[i].z)e.querySelector('.z').outerHTML='<div class="z">'+esc(CUES[i].z)+'</div>'}
      if(curIdx>=0)$('subZ').textContent=CUES[curIdx].z||'';
    }
    toast('翻译完成，已缓存（二刷零 token）');
  }catch(e){toast('翻译中断：'+e.message)}
  trBusy=false;$('btnTr').disabled=false;$('btnTr').textContent='🌐 翻译字幕';
}

// ---------- 卡芙卡吐槽 ----------
async function kafkaComment(idx){
  if(!CFG.key||kfkBusy)return;
  kfkBusy=true;
  try{
    const from=Math.max(0,idx-4);
    const ctx=CUES.slice(from,idx+1).map(c=>{
      let s='['+fmt(c.t0)+'] '+c.o.replace(/\n/g,' ');
      if(c.z)s+='\n译：'+c.z;
      return s;
    }).join('\n');
    const sys=P.get('sys')||'你是卡芙卡，用户的随身AI，语气轻快、有点小恶魔的俏皮。';
    const out=await chat(sys,'你和用户正在一起看视频「'+CUR.name+'」，以下是最近的字幕：\n'+ctx+'\n\n就刚才的剧情，用一两句话陪看吐槽或调侃（不要复述台词，像坐在旁边的朋友）。直接输出吐槽内容。',300);
    if(out){$('kfkText').textContent=out;const k=$('kafka');k.classList.add('show');
      if(novelMode){const d=document.createElement('div');d.className='kk';d.textContent='卡芙卡：'+out;$('novel').appendChild(d);d.scrollIntoView({behavior:'smooth'})}
      clearTimeout(kafkaComment._t);kafkaComment._t=setTimeout(()=>k.classList.remove('show'),9000)}
  }catch(e){}
  kfkBusy=false;
}
$('btnKfk').onclick=()=>{if(CUES.length)kafkaComment(Math.max(curIdx,0))};

// ---------- 小说模式 ----------
function enterNovel(){
  novelMode=true;$('btnMode').textContent='🎬 视频模式';
  $('vwrap').style.display='none';$('panel').style.display='none';$('novel').style.display='flex';
  const nv=$('novel');nv.innerHTML='';
  for(let i=0;i<CUES.length;i++){
    const c=CUES[i];
    const d=document.createElement('div');d.className='line';d.id='nl'+i;
    d.innerHTML=`<span class="tt">${fmt(c.t0)}</span>${esc(c.o)}${c.z?`<div class="zz">${esc(c.z)}</div>`:''}`;
    nv.appendChild(d);
  }
  const start=Math.max(curIdx,0);
  curIdx=start;lightNovel(start);
  novelStep();
}
let novelTimer=null;
function novelStep(){
  curIdx++;
  if(curIdx>=CUES.length-1)return;
  lightNovel(curIdx);
  if(curIdx-lastKfk>=20){lastKfk=curIdx;kafkaComment(curIdx)}
  const dur=Math.max(1200,Math.min((CUES[curIdx].t1-CUES[curIdx].t0)*1000,6000));
  novelTimer=setTimeout(novelStep,dur);
}
function lightNovel(i){
  const e=$('nl'+i);if(!e)return;
  const p=$('nl'+(i-1));if(p)p.style.color='var(--muted)';
  e.style.color='#fff';e.scrollIntoView({block:'center',behavior:'smooth'});
}
function exitNovel(){
  novelMode=false;
  if(novelTimer){clearTimeout(novelTimer);novelTimer=null}
  $('btnMode').textContent='📖 小说模式';
  $('vwrap').style.display='block';$('panel').style.display='block';$('novel').style.display='none';
  const i=Math.max(curIdx,0);if(CUES[i])$('vid').currentTime=CUES[i].t0;
}
$('btnMode').onclick=()=>{if(!CUES.length){toast('无字幕');return}novelMode?exitNovel():enterNovel()};
$('btnTr').onclick=translateAll;

$('btnBack').onclick=()=>{
  if($('player').style.display==='flex'){ // 播放器 → 库
    $('vid').pause();$('vid').src='';clearInterval(novelTimer);
    $('player').style.display='none';$('lib').style.display='block';loadLib();
  }else{ NATIVE?null:history.back() }
};
if(!NATIVE)$('btnBack').onclick=()=>{if($('player').style.display==='flex'){$('vid').pause();$('player').style.display='none';$('lib').style.display='block';loadLib()}};
loadLib();
</script>
</body>
</html>
