name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'website/**']
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install SDK pieces
        run: sdkmanager --install "platforms;android-37" "build-tools;37.0.0" "ndk;26.3.11579264"
      - name: Build
        run: bash android/apk/build.sh
        env:
          TAVERN_APK_MODE: Debug
          TAVERN_APK_SKIP_TESTS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: output/**/*.apk*
