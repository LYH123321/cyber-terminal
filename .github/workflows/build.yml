name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install SDK pieces
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$ANDROID_HOME/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          { echo "## Available SDK packages"; "$SDKM" --list 2>/dev/null | grep -E 'platforms;android-3|build-tools;3[5-9]|ndk;26' | head -40; } >> "$GITHUB_STEP_SUMMARY"
          "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" "ndk;26.3.11579264" > /tmp/sdk.log 2>&1 || { tail -c 900 /tmp/sdk.log; exit 1; }
      - name: Build
        run: bash android/apk/build.sh
        env:
          TAVERN_APK_MODE: Debug
          TAVERN_APK_SKIP_TESTS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: output/**/*.apk*
