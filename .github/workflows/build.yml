name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'website/**']
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Setup Android SDK
        run: |
          {
            echo "## SDK probe"
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME" || true
            ls "$ANDROID_HOME/cmdline-tools" || true
            SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            echo "SDKM=$SDKM"
            "$SDKM" --version || true
          } >> "$GITHUB_STEP_SUMMARY"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-37" "build-tools;37.0.0" "ndk;26.3.11579264" > /tmp/sdk.log 2>&1 || { echo "INSTALL FAILED, full log:" >> "$GITHUB_STEP_SUMMARY"; cat /tmp/sdk.log >> "$GITHUB_STEP_SUMMARY"; exit 1; }; tail -3 /tmp/sdk.log >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        run: bash android/apk/build.sh
        env:
          TAVERN_APK_MODE: Debug
          TAVERN_APK_SKIP_TESTS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: output/**/*.apk*
